name: Release

# Tag pushes (v*) build a signed + notarized ConsoleMode.app and publish it as
# a GitHub Release asset. workflow_dispatch runs the exact same sign/notarize
# path for rehearsal without publishing anything (see the publish step's
# `startsWith(github.ref, 'refs/tags/v')` guard below).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  APP_NAME: ConsoleMode

jobs:
  release:
    runs-on: macos-latest
    # Only the scope this workflow actually needs (release-asset upload).
    permissions:
      contents: write
    env:
      # `secrets` is not usable in step-level `if:` — mirror it into a
      # job-level env var and gate every signing step on that instead. This
      # lets the workflow run cleanly (build-only, no signing) before the
      # maintainer has configured any of the secrets below.
      HAS_SIGNING: ${{ secrets.CONSOLEMODE_MACOS_CERT_DEPLOY_KEY != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cert vault deploy key
        if: env.HAS_SIGNING == 'true'
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.CONSOLEMODE_MACOS_CERT_DEPLOY_KEY }}" > ~/.ssh/console_mode_certs_deploy_key
          chmod 600 ~/.ssh/console_mode_certs_deploy_key
          cat >> ~/.ssh/config <<'EOF'
          Host console-mode-certs-vault
            HostName github.com
            User git
            IdentityFile ~/.ssh/console_mode_certs_deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
          EOF
          chmod 600 ~/.ssh/config

      - name: Clone cert vault
        if: env.HAS_SIGNING == 'true'
        run: |
          git clone --depth 1 \
            git@console-mode-certs-vault:seanperkins/console-mode-macos-certs.git \
            "$RUNNER_TEMP/certs-vault"

      - name: Create runner keychain
        if: env.HAS_SIGNING == 'true'
        run: |
          KEYCHAIN="$RUNNER_TEMP/console-mode-ci.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          echo "KEYCHAIN_PATH=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # codesign searches the search list, not just the default keychain.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

      - name: Import signing certificate
        if: env.HAS_SIGNING == 'true'
        run: |
          security import "$RUNNER_TEMP/certs-vault/vault.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "${{ secrets.CONSOLEMODE_MACOS_CERT_PASSWORD }}"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Build
        run: swift build -c release

      # Mirrors the Makefile's `bundle` target (see Makefile) but without the
      # ad-hoc `codesign --sign -` — real signing happens below.
      - name: Assemble app bundle
        run: |
          rm -rf "$APP_NAME.app"
          mkdir -p "$APP_NAME.app/Contents/MacOS" "$APP_NAME.app/Contents/Resources"
          cp ".build/release/$APP_NAME" "$APP_NAME.app/Contents/MacOS/$APP_NAME"
          cp Resources/Info.plist "$APP_NAME.app/Contents/Info.plist"

      - name: Sign app bundle
        if: env.HAS_SIGNING == 'true'
        run: |
          codesign --force --deep --options runtime \
            --sign "${{ secrets.CONSOLEMODE_MACOS_SIGNING_IDENTITY }}" \
            "$APP_NAME.app"

      - name: Zip for notarization
        if: env.HAS_SIGNING == 'true'
        run: ditto -c -k --keepParent "$APP_NAME.app" "$APP_NAME-notarize.zip"

      - name: Notarize
        if: env.HAS_SIGNING == 'true'
        run: |
          echo "${{ secrets.ASC_KEY_CONTENT }}" | base64 --decode -o "$RUNNER_TEMP/asc_key.p8"
          xcrun notarytool submit "$APP_NAME-notarize.zip" \
            --key "$RUNNER_TEMP/asc_key.p8" \
            --key-id "${{ secrets.ASC_KEY_ID }}" \
            --issuer "${{ secrets.ASC_ISSUER_ID }}" \
            --wait

      - name: Staple
        if: env.HAS_SIGNING == 'true'
        run: xcrun stapler staple "$APP_NAME.app"

      - name: Zip release artifact
        if: env.HAS_SIGNING == 'true'
        run: |
          rm -f "$APP_NAME-notarize.zip"
          ditto -c -k --keepParent "$APP_NAME.app" "$APP_NAME.zip"

      # Only a real tag push publishes. workflow_dispatch stops here — it
      # exercises the full sign/notarize/staple path without releasing.
      - name: Publish release
        if: env.HAS_SIGNING == 'true' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "$APP_NAME.zip" --generate-notes

      - name: Cleanup
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/certs-vault"
          rm -f "$RUNNER_TEMP/asc_key.p8"
          rm -f ~/.ssh/console_mode_certs_deploy_key
          if [ -n "${KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
